<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06090d"><title>Mando te llama</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  html { font-size: 18px; } body.llamada { min-height: 100vh; display: grid; align-content: center; gap: 1.2rem; padding: 1.4rem; text-align: center; overflow: auto; }
  .ring { font-size: .8rem; letter-spacing: .3em; color: var(--amber); font-weight: 800; } h1 { margin: 0; font-size: 1.7rem; line-height: 1.15; }
  .order { font-size: 1.15rem; line-height: 1.35; color: #ffe2ad; border: 1px solid var(--line-2); border-radius: 8px; padding: 1rem; background: var(--panel); }
  .pick { background: var(--green); color: #04140b; border: 0; border-radius: 999px; padding: 1.3rem; font-size: 1.4rem; font-weight: 900; letter-spacing: .12em; animation: wait 1.2s ease-in-out infinite; }
  .pick:disabled { opacity: .5; animation: none; } .row { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; } .row button { border: 0; border-radius: 8px; padding: 1.1rem; font-weight: 900; font-size: 1.1rem; }
  .yes { background: var(--green); color: #04140b; } .no { background: var(--red); color: #fff; } .hang { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-2) !important; grid-column: 1 / -1; }
  .lines { text-align: left; display: grid; gap: .5rem; } .lines p { margin: 0; padding: .6rem .8rem; border-radius: 8px; background: var(--panel); font-size: 1.05rem; line-height: 1.3; }
  .lines p.m { border-left: .25rem solid var(--amber); } .lines p.p { border-left: .25rem solid var(--cyan); } .lines em { display: block; font-style: normal; font-size: .68rem; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
  .msg { color: var(--dim); font-size: .95rem; line-height: 1.4; } .msg.err { color: #ffb3b3; } .tag { font-family: var(--mono); font-size: .72rem; color: var(--faint); }
</style></head>
<body class="llamada">
<div class="ring" id="ring">MANDO TE LLAMA</div>
<h1 id="title">…</h1>
<div class="order" id="order" hidden></div>
<button class="pick" id="pick">DESCOLGAR</button>
<div class="lines" id="lines"></div>
<div class="row" id="mock" hidden><button class="yes" data-r="accept">ACEPTO</button><button class="no" data-r="reject">NO PUEDO</button></div>
<div class="row" id="live" hidden><button class="hang" id="hang">COLGAR</button></div>
<div class="msg" id="msg"></div>
<div class="tag">LLAMADA WEB · HappyRobot Voice</div>
<audio id="audio" autoplay></audio>
<script src="/static/vendor/livekit-client.umd.min.js" onerror="window.NO_LIVEKIT = true"></script>
<script src="/static/llamada.js"></script>
</body></html>
