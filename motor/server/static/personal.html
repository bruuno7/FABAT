<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MANDO · Personal de campo</title><link rel="stylesheet" href="/static/personal.css"></head>
<body><header><strong>MANDO <span>PERSONAL DE CAMPO</span></strong><p id="identity">Abre el enlace de tu unidad</p></header>
<main><section id="setup"><h1>Tu unidad</h1><label>Unidad<select id="unit"></select></label><label>Cargo<select id="role"></select></label><p>Para enviar partes, el centro debe darte un enlace firmado para esta unidad y escena.</p><label>Enlace del centro<input id="link" type="text" autocomplete="off" placeholder="Pega aquí tu enlace"></label><button id="open">Usar enlace</button></section>
<section id="work" hidden><h1>Órdenes vigentes</h1><div id="orders"></div><h2>Parte de estado</h2><label>Zona<select id="zone"></select></label><div class="statuses" id="statuses"></div><label>Detalle o motivo<textarea id="detail" maxlength="400" rows="3" placeholder="Puedes añadir información antes de tocar el estado"></textarea></label><button data-status="note">Enviar texto</button><button data-status="new_notice">Veo otra cosa · aviso nuevo</button><button data-status="false_alarm">Desmentir incidente en el sitio</button></section>
<p id="confirmation" role="status" aria-live="polite">Conectando…</p></main><script src="/static/personal.js"></script></body></html>
